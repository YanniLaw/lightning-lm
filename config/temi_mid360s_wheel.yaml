# Temi Mid-360 轮速融合 bag 验证；B=center_of_rotation_link，L=livox_frame。
# 轮速外参直接从 YAML 读取；只回放 LiDAR/IMU/odom，排除旧 TF。
common:
  dataset: "temi"
  lidar_topic: "points_raw"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  wheel_odom_topic: "/odom"
  lidar_frame: "livox_frame" # TF 发布雷达相对于水平 map 的真实位姿

wheel_odometry:
  # 雷达在轮心系中的位姿：p_B = R * p_L + T，与 fasterlio 的 L -> I 分开。
  extrinsic_T: [-0.12, 0.0, 0.21] # 雷达原点在轮心系中的位置，米
  extrinsic_R: [0.992546157447128, 0.0, 0.1218692961206426,
                0.0, 1.0, 0.0,
                -0.1218692961206426, 0.0, 0.992546157447128] # L -> B，按行展开
  wheel_time_offset: 0.0 # effective_time = header_time + offset，秒
  default_velocity_variance: 0.01 # (m/s)^2 编码器前向速度方差，忽略消息协方差
  nhc_lateral_variance: 0.01 # (m/s)^2 轮心侧向零速度软约束
  nhc_vertical_variance: 0.04 # (m/s)^2 轮心竖向零速度软约束

system:
  with_rviz: true # 是否发布的RViz可视化话题
  rviz_local_map_publish_hz: 2.0 # RViz累积局部地图发布频率，<=0表示每帧发布
  rviz_local_map_max_scans: 200 # RViz累积局部地图最多保留的扫描帧数
  rviz_path_publish_hz: 10.0 # RViz轨迹发布频率
  with_loop_closing: false # 前端对照验证，排除回环优化的影响
  with_wheel_odometry_fusion: true # 是否订阅并融合轮速里程计
  with_ui: false # 无需启动 Pangolin 窗口；保留 RViz 话题
  with_2dui: false # 是否需要2D UI
  with_g2p5: false # 本次只验证三维前端
  step_on_kf: false # 是否在关键帧处暂停

  lio_type: "aa_fasterlio"
  optimizer_type: "miao"

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/temi_wheel_validation/
  pub_tf: true

# fasterlio 参数
fasterlio:
  lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 32
  blind: 0.1                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  # Mid-360 点云按时间/扫描顺序排列；每 4 点抽 1 点会在长走廊中形成
  # 空间采样退化，导致前进方向约束不足。每 2 点抽 1 点是稳定性和开销的折中。
  point_filter_num: 3 # 点云采样参数
  max_iteration: 4 # 最大迭代次数
  filter_size_scan: 0.2 # 对scan进行的降采样
  filter_size_map: 0.2

  ivox_grid_resolution: 0.2        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: false  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  # L -> I：按真实 IMU 测量轴向配置，不根据 IMU 消息的 frame 名推断。
  extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false
  kf_dis_th: 0.5    # m
  kf_angle_th: 10.0 # degree

  enable_icp_part: false
  plane_icp_weight: 300.0
  min_pts: 500
  imu_filter: false
  proj_kfs: false


g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.20  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨率

loop_closing:
  loop_kf_gap: 20       # 兼容旧配置；检测间隔请使用 detection_interval
  detection_interval: 20
  optimize_every_n_nodes: 20
  num_threads: 6
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 10.0       # 候选帧的最大距离
  ndt_score_th: 1.3     # ndt位姿分值
  with_height: false


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 10.0
  height_min: -5.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
